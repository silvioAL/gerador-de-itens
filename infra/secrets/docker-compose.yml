# Infisical self-hosted (SPEC-12) — stack de segredos, deliberadamente separada
# do docker-compose.yml do projeto (não é do domínio do gerador-de-itens, é
# infraestrutura compartilhável). Pode ser movida pra qualquer outra pasta ou
# máquina sem alterar nada aqui dentro — a única coisa que a liga ao projeto é
# o nome da rede Docker externa (ver "networks" abaixo).
#
# Uso:
#   1. docker network create gerador-secrets-net   (uma vez por máquina)
#   2. cp .env.example .env  e preencher (ver instruções no próprio arquivo)
#   3. docker compose up -d
#   4. abrir http://localhost:8081, criar o admin, criar o projeto, colar os
#      segredos reais (OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, ...), criar uma
#      Machine Identity com acesso de leitura — ver SPEC-12 §5.
#      (porta 8081, não 8080 — 8080 já é o frontend do próprio gerador-de-itens,
#      ver docker-compose.yml na raiz do projeto)

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infisical-internal

  redis:
    image: redis:7-alpine
    command: --requirepass ${REDIS_PASSWORD}
    volumes:
      - infisical-redis-data:/data
    networks:
      - infisical-internal

  backend:
    # "latest" pra começar rápido — pin numa tag específica antes de depender
    # disso em produção de verdade (mesma regra que já valia pras imagens do
    # próprio projeto).
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      SITE_URL: ${SITE_URL}
      DB_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    ports:
      # Só pra abrir a UI de administração pelo host (setup inicial e
      # rotação de segredos). O tráfego container-a-container (o `server`
      # do projeto principal buscando segredo) passa pela rede externa
      # abaixo, não por essa porta publicada.
      - "8081:8080"
    networks:
      - infisical-internal
      - gerador-secrets-net

networks:
  infisical-internal:
    # Rede interna só entre backend/db/redis — nenhum outro projeto precisa
    # alcançar o Postgres/Redis do Infisical diretamente.
  gerador-secrets-net:
    # Rede externa compartilhada com o docker-compose.yml do projeto (e de
    # qualquer outro projeto futuro que precise deste mesmo vault) — criada
    # uma vez por máquina com `docker network create gerador-secrets-net`,
    # nunca por este compose (ver SPEC-12 §2.2).
    external: true

volumes:
  infisical-db-data:
  infisical-redis-data:
