name: Deploy

# Só a main, e só depois do CI passar pro mesmo commit — nunca builda/publica
# a partir de um push que ainda não foi validado (ver SPEC-15 §4).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # VITE_API_URL=/api — Caddy roteia por path no mesmo domínio, não
      # subdomínio (ver Caddyfile e SPEC-15 §3, motivo do cookie sameSite=lax).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ghcr.io/${{ github.repository_owner }}/gerador-web:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gerador-server:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Copia só o que a VM precisa pra subir a stack — nunca o repositório
      # inteiro (nem config/, que já vai dentro da imagem web via Dockerfile).
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_SSH_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.secrets.yml,Caddyfile"
          target: "/opt/gerador"

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_SSH_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd /opt/gerador
            export DOMAIN="${{ secrets.DOMAIN }}"
            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"
            docker compose -f docker-compose.prod.yml -f docker-compose.secrets.yml pull
            docker compose -f docker-compose.prod.yml -f docker-compose.secrets.yml up -d
