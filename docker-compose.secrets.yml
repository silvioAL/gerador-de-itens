# Overlay opt-in (SPEC-12) — NÃO usado por padrão. `docker compose up` sozinho
# continua exatamente como antes (AUTH_MODE=dev, sem depender do Infisical).
# Só entra em jogo em produção, com AUTH_MODE=oidc, combinando os dois arquivos:
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# Pré-requisito: a stack de infra/secrets/ (Infisical) já de pé na mesma
# máquina, na rede `gerador-secrets-net` (ver infra/secrets/docker-compose.yml
# e SPEC-12 §5). As variáveis INFISICAL_* abaixo vêm do `.env` deste repo
# (nunca commitado — ver .env.example), preenchidas com a Machine Identity
# criada na UI do Infisical.

services:
  server:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER_URL: https://accounts.google.com
      # URL pública do próprio server (/auth/callback) — não é segredo, mas
      # muda por deploy, então fica no .env deste repo, não no vault.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENV: ${INFISICAL_ENV}
      INFISICAL_API_URL: http://infisical:8080
    networks:
      - default
      - gerador-secrets-net

networks:
  gerador-secrets-net:
    external: true
