name: CI

# §275 — `push` só na main.
#
# Com `on: push` sem filtro, todo push numa branch de PR disparava DOIS runs
# idênticos (um por evento) sobre o mesmo commit. Eles competem pelo mesmo pool
# de runners, e o segundo ficou pendurado duas vezes seguidas — 74 minutos numa,
# sem sequer atualizar o status depois de criado. Cancelei os dois na mão e
# fundi pelo run do `pull_request`, que é a definição de contornar em vez de
# consertar.
#
# Agora: `pull_request` cobre as branches, `push` cobre a main depois do merge.
on:
  push:
    branches: [main]
  pull_request:

# E se alguém empurrar duas vezes seguidas, o run velho morre em vez de disputar
# runner com o novo: o resultado que interessa é sempre o do último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # packages/server/src/app.test.ts roda contra Postgres real (migrações
    # próprias no beforeAll), não mock — mesmas credenciais do docker-compose.yml
    # de dev, só pra este job efêmero do CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gerador
          POSTGRES_PASSWORD: gerador
          POSTGRES_DB: gerador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerador -d gerador"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build --workspaces --if-present

      # ACHADO #286: o build do CLI roda só `tsup`, que NÃO typecheca — e foi
      # isso que deixou um `explicarRespostaRecusada is not defined` chegar
      # publicado. O `web` sempre rodou `tsc --noEmit`; o CLI nunca rodou.
      # Aqui o portão passa a valer pra todo workspace que tenha o script.
      - run: npm run typecheck --workspaces --if-present

      - run: npm test --workspaces --if-present
        env:
          # `gerador_test`, não `gerador`: a suíte trunca tabelas, e o padrão
          # antigo apontava pro mesmo banco do docker-compose de desenvolvimento
          # — aqui é efêmero, mas a URL do CI é a que as pessoas copiam. O banco
          # é criado sob demanda (src/test-support/bancoDeTeste.ts).
          DATABASE_URL: postgres://gerador:gerador@localhost:5432/gerador_test

      - run: npm run lint --workspaces --if-present

  # ACHADO REAL: este job não existia, e a suíte Playwright estava MORTA há
  # muitas rodadas — 19 testes, dos quais 9 falhavam por seletor ou texto que o
  # produto tinha mudado meses antes. Ninguém tinha visto porque ninguém rodava.
  #
  # Isso custou caro de verdade: a SPEC-31 Fase 4 entregou o modo hospedado com
  # a suíte de unidade verde e QUATRO defeitos chegaram ao usuário, todos no vão
  # que só um navegador enxerga (CORS, dialeto de JSON, corpo do teste de
  # credencial, forma do `/ia/status`). Existia um teste de navegador. Ele
  # estava vermelho e ninguém sabia.
  #
  # Job separado do `test` de propósito: precisa de browser (~400 MB) e de dois
  # servidores de pé, e falhar aqui deve dizer "o navegador quebrou", não se
  # misturar com uma falha de unidade.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gerador
          POSTGRES_PASSWORD: gerador
          # Nome termina em `_test` porque `exigirBancoDescartavel` (globalSetup)
          # recusa truncar banco que não se declare descartável. O service
          # container já é efêmero; agora o NOME também diz isso.
          POSTGRES_DB: gerador_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerador -d gerador_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Só o Chromium: a suíte não testa diferença entre motores, e baixar os
      # três triplicaria o tempo do job sem responder pergunta nenhuma.
      - run: npx playwright install --with-deps chromium

      # `playwright.config.ts` sobe sozinho os três processos que a suíte
      # precisa (server Fastify, vite e o gateway de IA falso) — aqui não há
      # nada a orquestrar além do banco, que é o `services` acima.
      - run: npm run test:e2e --workspace packages/web
        env:
          DATABASE_URL: postgres://gerador:gerador@localhost:5432/gerador_e2e_test

      # O screenshot de cada falha é o que torna um E2E vermelho diagnosticável
      # sem reproduzir na máquina de ninguém.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultados
          path: packages/web/test-results/
          retention-days: 7
