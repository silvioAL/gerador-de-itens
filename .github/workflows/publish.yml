name: Publish CLI

# SPEC-17: caminho de distribuição padrão agora é o pacote npm, não a imagem
# Docker (ver deploy.yml, que virou manual/opcional). Dispara numa tag de
# versão (ex.: v0.1.1) — o push da tag já dispara CI (ver ci.yml, "on: push"
# cobre tags também) rodando a suíte completa dos 4 workspaces; este workflow
# não reroda tudo de novo, só valida+builda o pacote que de fato vai publicar.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — Trusted Publishing do npm, sem NPM_TOKEN nenhum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Trusted Publishing exige npm >= 11.5.1, que node 20 não traz por padrão
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm test --workspace=packages/cli

      - run: npm run build --workspace=packages/cli

      # Trusted Publishing (OIDC): precisa estar configurado antes em
      # npmjs.com → settings do pacote → Trusted Publisher (org/repo/workflow
      # exatos, ver SPEC-17 §7.3) — sem isso, este passo falha por falta de
      # auth (não há NODE_AUTH_TOKEN aqui de propósito). --no-provenance
      # porque a atestação de proveniência não funciona em repositório
      # privado, e o Trusted Publishing liga provenance por padrão.
      - run: npm publish --workspace=packages/cli --no-provenance
