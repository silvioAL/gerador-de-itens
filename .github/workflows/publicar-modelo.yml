name: Publicar modelo em pacotes-parte

# SPEC-32 — publica um modelo GGUF como pacotes npm, pra quem não alcança o
# Hugging Face.
#
# A peça que faz isto valer a pena: **o runner do GitHub alcança o Hugging
# Face**. Ele baixa, fatia e publica — ninguém precisa baixar 2,5 GB numa
# máquina pra depois levar por pendrive até outra.
#
# Manual (workflow_dispatch) de propósito: publicar ~2,5 GB no registry é caro
# e irreversível (versão publicada não se apaga de verdade). Não é coisa pra
# disparar sozinho num push.
on:
  workflow_dispatch:
    inputs:
      modelo:
        description: "Qual modelo publicar"
        required: true
        type: choice
        options:
          - qwen-local
          - embedding
      escopo:
        description: "Escopo npm dos pacotes-parte (ex.: @silvioal)"
        required: true
        type: string
      versao:
        description: "Versão dos pacotes-parte"
        required: true
        default: "1.0.0"
        type: string
      simular:
        description: "Só fatiar e mostrar o resultado, sem publicar"
        required: false
        default: true
        type: boolean

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — mesmo mecanismo do publish.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Mesmo achado do publish.yml: o npm que vem com o Node 22 do runner é
      # anterior ao 11.5.1 que o Trusted Publishing exige, e sem isso o publish
      # vira chamada não autenticada e o registry responde 404 em vez de erro
      # de permissão — causa nada óbvia pelo log.
      - run: npm install -g npm@latest

      - name: Descobrir a URL do modelo no registro do projeto
        id: modelo
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const fonte = readFileSync("packages/llm/src/modelos.ts", "utf-8");
            // Lê o registro do próprio projeto em vez de repetir repo/arquivo
            // aqui: duas fontes de verdade divergiriam calado, e o sintoma
            // seria publicar partes de um modelo diferente do que a ferramenta
            // espera baixar.
            const bloco = fonte.split(process.env.MODELO === "embedding" ? "MODELO_EMBEDDING" : "MODELO_CHAT")[1];
            const repo = /repositorioHuggingFace: "([^"]+)"/.exec(bloco)[1];
            const arquivo = /nomeArquivo: "([^"]+)"/.exec(bloco)[1];
            console.log(`url=https://huggingface.co/${repo}/resolve/main/${arquivo}`);
            console.log(`arquivo=${arquivo}`);
          ' >> "$GITHUB_OUTPUT"
        env:
          MODELO: ${{ inputs.modelo }}

      - name: Baixar o GGUF
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o "${{ steps.modelo.outputs.arquivo }}" \
            "${{ steps.modelo.outputs.url }}"
          ls -lh "${{ steps.modelo.outputs.arquivo }}"

      - name: Fatiar em pacotes-parte
        run: |
          node scripts/fatiar-modelo.mjs "${{ steps.modelo.outputs.arquivo }}" \
            --escopo "${{ inputs.escopo }}" \
            --versao "${{ inputs.versao }}" \
            --saida dist-modelo

      # Prova que a remontagem bate ANTES de publicar. Sem isto, um erro de
      # fatiamento só apareceria na máquina de quem instalou — e como o
      # tamanho estaria certo, o sintoma seria o modelo gerando lixo.
      - name: Conferir que as partes remontam o arquivo original
        run: |
          cat dist-modelo/parte-*/parte.bin > remontado.bin
          esperado=$(node -e 'console.log(require("./dist-modelo/manifesto.json").sha256)')
          obtido=$(sha256sum remontado.bin | cut -d" " -f1)
          echo "esperado: $esperado"
          echo "obtido:   $obtido"
          [ "$esperado" = "$obtido" ] || { echo "::error::remontagem NÃO bate — nada será publicado"; exit 1; }
          rm remontado.bin

      # Aqui NÃO dá pra usar OIDC como o publish.yml faz. O Trusted Publishing
      # do npm é configurado por pacote, na página de um pacote que **já
      # existe** — e estes são 13 nomes novos. Por isso, e só por isso, este
      # workflow depende de um token.
      #
      # O token mora em Settings → Secrets → Actions (NPM_TOKEN), nunca no
      # repositório e nunca colado numa conversa. Se ele não estiver lá, o
      # passo falha dizendo isso, em vez de tentar publicar sem auth e receber
      # um 404 que não explica nada (foi o que aconteceu no publish.yml).
      - name: Publicar as partes
        if: ${{ !inputs.simular }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::falta o secret NPM_TOKEN (Settings → Secrets → Actions). Os pacotes-parte são nomes novos, e Trusted Publishing só vale pra pacote já existente."
            exit 1
          fi
          for d in dist-modelo/parte-*; do
            (cd "$d" && npm publish --access public --no-provenance)
          done

      - name: O que colar em packages/llm/src/modelos.ts
        run: |
          echo "### Cole no modelo \`${{ inputs.modelo }}\` em packages/llm/src/modelos.ts" >> "$GITHUB_STEP_SUMMARY"
          echo '```ts' >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const m = require("./dist-modelo/manifesto.json");
            console.log(`  sha256: "${m.sha256}",`);
            console.log(`  partesNpm: ${JSON.stringify(m.partesNpm, null, 2).replace(/\n/g, "\n  ")},`);
          ' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: manifesto-${{ inputs.modelo }}
          path: dist-modelo/manifesto.json
