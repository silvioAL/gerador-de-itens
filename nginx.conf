server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # config/ muda a cada rebuild deste projeto (é o próprio ponto do carregamento em
    # runtime) — sem isso, nginx serve com Last-Modified/ETag mas nenhum Cache-Control,
    # e o browser aplica cache heurístico e mostra config velha até um hard refresh.
    location /config/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
