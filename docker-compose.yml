services:
  gerador:
    build: .
    ports:
      - "8080:80"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gerador
      POSTGRES_PASSWORD: gerador
      POSTGRES_DB: gerador
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerador -d gerador"]
      interval: 2s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://gerador:gerador@db:5432/gerador
      CONFIG_DIR: /app/config
      ORIGEM_WEB: http://localhost:8080
      # AUTH_MODE=dev é o padrão local/E2E: login aceita só o e-mail, sem IdP
      # (ver SPEC-08 §2.1). O botão "entrar com Google" da LoginScreen só
      # aparece quando o servidor responde `oidc` em /auth/modo — então nesta
      # stack ele nunca apareceu, e não é por bug: é este valor aqui.
      #
      # Vem do ambiente (.env) em vez de fixo: pra experimentar o Google basta
      # preencher o .env e subir de novo, sem editar arquivo versionado.
      # Precisa dos QUATRO OIDC_* preenchidos — com AUTH_MODE=oidc e algum
      # faltando, o servidor sobe e só falha na hora de logar.
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Tem que bater EXATAMENTE com o "URI de redirecionamento autorizado" do
      # cliente OAuth no Google Cloud Console, porta inclusive.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:4000/auth/callback}
      # Opcional: restringe o login a um domínio de e-mail (ex.: suaempresa.com).
      # Vazio = qualquer conta Google entra.
      OIDC_DOMINIO_PERMITIDO: ${OIDC_DOMINIO_PERMITIDO:-}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # SPEC-31 — o modelo de IA rodando DENTRO da stack.
  #
  # O motivo é concreto: num ambiente corporativo que bloqueia a API do Claude,
  # o modo hospedado ficaria sem IA nenhuma. Com o Ollama aqui, o servidor fala
  # com `http://ollama:11434/v1` pela rede interna do compose — nenhuma chamada
  # sai da máquina, e o `packages/server` continua sem `node-llama-cpp` (ele só
  # faz HTTP; quem carrega o GGUF é este container, que não é nosso).
  #
  # `profiles: ["ia"]` deixa isto DE FORA do `docker compose up` normal, de
  # propósito: são ~4,7 GB de modelo, e quem sobe a stack só pra ver a
  # ferramenta não deve pagar por eles. Ligar é explícito:
  #
  #     docker compose --profile ia up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ia"]
    volumes:
      # Sem isto, cada `docker compose down` joga fora o modelo baixado e a
      # próxima subida baixa os 4,7 GB de novo.
      - ollama-models:/root/.ollama
    ports:
      # Publicado pra fora também: assim a MESMA instância serve o modo local
      # (`gerador open` -> http://localhost:11434) sem instalar Ollama na máquina.
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    # GPU NVIDIA, se houver: descomente as seis linhas abaixo. Em CPU pura,
    # medido nesta máquina, o `qwen2.5:7b` leva ~16s por campo — uma esteira de
    # 8 itens vira minutos de espera. Precisa do NVIDIA Container Toolkit
    # instalado no host; sem ele, o `docker compose up` falha na hora de criar o
    # container (não degrada silenciosamente pra CPU).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # SPEC-30 Fase 1a — transcrição de voz, também dentro da stack.
  #
  # Serviço SEPARADO porque o Ollama **não transcreve**: ele serve modelos de
  # texto e visão, e não tem `/audio/transcriptions`. Este fala o mesmo dialeto
  # compatível com a OpenAI, então o adaptador do produto conversa com ele sem
  # uma linha de código nova.
  #
  # Medido nesta máquina, em CPU, com 33s de fala em português:
  #
  #   base (145 MB)             1,1 s
  #   small (465 MB)            3,5 s
  #   large-v3-turbo (1,6 GB)   11 s
  #
  # `base` é o padrão porque o que faltava não era tamanho de modelo: era
  # VOCABULÁRIO. Os três erravam "RabbitMQ" e "idempotência"; o `base` com o
  # vocabulário do projeto (montarVocabularioTranscricao, no engine) acerta os
  # dois. Subir o modelo custava 10x o tempo e não resolvia.
  whisper:
    image: hwdsl2/whisper-server
    profiles: ["ia"]
    environment:
      WHISPER_MODEL: ${MODELO_VOZ:-base}
      # Vazio = sem autenticação. É um serviço interno da rede do compose, e a
      # porta publicada abaixo é pra própria máquina — a chave só adicionaria
      # um segredo a gerenciar sem fronteira nova pra proteger.
      WHISPER_API_KEY: ""
      WHISPER_LANGUAGE: pt
    volumes:
      - whisper-models:/var/lib/whisper
    ports:
      # Publicado pra fora pelo mesmo motivo do Ollama: a MESMA instância serve
      # o `gerador open` (modo local), sem instalar nada na máquina.
      - "9000:9000"

  # Baixa o modelo uma vez e sai. Sem isto, a primeira chamada da esteira
  # falharia com "model not found" — que é um jeito ruim de descobrir que
  # faltava um passo manual.
  ollama-modelo:
    image: ollama/ollama:latest
    profiles: ["ia"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Faz o CLI falar com o container do serviço em vez de subir um servidor
      # próprio — por isso este aqui não precisa do volume.
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${MODELO_IA:-qwen2.5:7b}"]
    restart: "no"

volumes:
  db-data:
  ollama-models:
  whisper-models:
